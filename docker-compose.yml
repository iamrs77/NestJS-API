# Start the database and the API:  docker compose up --build
# Start only the database:         npm run db:up
# Start the test database:         npm run db:test:up

services:
  # PostgreSQL for the API. Also used when you run the API with npm.
  db:
    image: postgres:17
    ports:
      - 5434:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '123'
      POSTGRES_DB: nest
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nest']
      interval: 2s
      timeout: 5s
      retries: 15

  # The API, built from the Dockerfile. Open http://localhost:3000/docs
  api:
    build: .
    ports:
      - 3000:3000
    environment:
      DATABASE_URL: postgresql://postgres:123@db:5432/nest?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/docs-json').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Throwaway database for the e2e tests (settings in .env.test).
  # It only starts when you ask for it by name.
  test-db:
    image: postgres:17
    profiles: [test]
    ports:
      - 5435:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '123'
      POSTGRES_DB: nest
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nest']
      interval: 2s
      timeout: 5s
      retries: 15
